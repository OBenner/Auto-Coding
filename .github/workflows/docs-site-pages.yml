name: Deploy Docs Portal to GitHub Pages

on:
  push:
    branches: ["develop"]
    paths:
      - "site/**"
      - "*.md"
      - "**/*.md"
      - ".github/workflows/docs-site-pages.yml"
  workflow_dispatch:

concurrency:
  group: "docs-portal-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build docs portal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.0
        with:
          persist-credentials: false

      - name: Build Markdown document index
        run: node site/scripts/build-docs-data.mjs

      - name: Validate docs portal structure
        run: >
          node -e "const fs = require('fs');
          for (const file of [
            'site/index.html',
            'site/assets/css/styles.css',
            'site/assets/js/content.js',
            'site/assets/js/app.js',
            'site/assets/data/docs-data.js'
          ]) {
            if (!fs.existsSync(file)) throw new Error(file + ' is missing');
          }"

      - name: Upload validated site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: docs-site-${{ matrix.os }}
          path: site/
          if-no-files-found: error
          retention-days: 1

  upload-pages-artifact:
    name: Upload Pages artifact
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
    steps:
      - name: Download Linux build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: docs-site-ubuntu-latest
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: upload-pages-artifact
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
