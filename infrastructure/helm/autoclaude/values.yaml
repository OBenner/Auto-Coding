---
# Default values for autoclaude Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  # Image registry for all images
  imageRegistry: ""

  # Image pull secrets for private registries
  imagePullSecrets: []

# AutoClaude Backend Settings
backend:
  enabled: true

  # Container image
  image:
    repository: your-registry.io/autoclaude-backend
    tag: latest
    pullPolicy: Always

  # Number of replicas
  replicaCount: 2

  # Service configuration
  service:
    type: LoadBalancer
    port: 80
    targetPort: 8000
    annotations: {}
    # Session affinity for WebSocket support
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800  # 3 hours

  # Ingress configuration
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: autoclaude.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: autoclaude-tls
    #    hosts:
    #      - autoclaude.example.com

  # Resource limits and requests
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # Liveness probe
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  # Readiness probe
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

# PostgreSQL Database
postgresql:
  enabled: true

  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent

  # Number of replicas
  replicaCount: 1

  # Service configuration
  service:
    type: ClusterIP
    port: 5432

  # Resource limits and requests
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Persistent storage
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: ""  # Uses default storage class

  # Liveness probe
  livenessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - postgres
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  # Readiness probe
  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - postgres
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Redis Cache
redis:
  enabled: true

  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

  # Number of replicas
  replicaCount: 1

  # Service configuration
  service:
    type: ClusterIP
    port: 6379

  # Resource limits and requests
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Persistent storage
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: ""  # Uses default storage class

  # Liveness probe
  livenessProbe:
    exec:
      command:
        - redis-cli
        - ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  # Readiness probe
  readinessProbe:
    exec:
      command:
        - redis-cli
        - ping
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Configuration values (ConfigMap)
config:
  # Server settings
  host: "0.0.0.0"
  port: 8000
  debug: false
  logLevel: INFO

  # CORS settings
  corsOrigins: "*"

  # Database settings
  postgresUser: autoclaude
  postgresDb: autoclaude

  # Redis settings
  redisHost: redis
  redisPort: 6379
  redisDb: 0

  # OAuth settings
  oauthRedirectUri: "https://autoclaude.example.com/auth/callback"

  # Access token expiration
  accessTokenExpireMinutes: 30

  # WebSocket heartbeat interval
  wsHeartbeatInterval: 30

# Secret values (Secret)
# These should be overridden using --set or a values file
secrets:
  # Application secret key
  secretKey: "change-me-in-production"

  # PostgreSQL password
  postgresPassword: "change-me-in-production"

  # Redis password
  redisPassword: ""

  # GitHub OAuth
  githubClientId: ""
  githubClientSecret: ""

  # GitLab OAuth
  gitlabClientId: ""
  gitlabClientSecret: ""

# Namespace to deploy into
namespace: default

# Name override
nameOverride: ""
fullnameOverride: ""
