{{- /*
Secret for AutoClaude sensitive data
*/ -}}
{{- if .Values.backend.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autoclaude.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "autoclaude.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Authentication secret key for JWT tokens
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}

  {{- if .Values.postgresql.enabled }}
  # PostgreSQL password
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}

  {{- if and .Values.redis.enabled .Values.secrets.redisPassword }}
  # Redis password (optional, leave empty if not using Redis auth)
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}

  # GitHub OAuth credentials
  # Register app at: https://github.com/settings/developers
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}

  # GitLab OAuth credentials
  # Register app at: https://gitlab.com/-/profile/applications
  GITLAB_CLIENT_ID: {{ .Values.secrets.gitlabClientId | quote }}
  GITLAB_CLIENT_SECRET: {{ .Values.secrets.gitlabClientSecret | quote }}
{{- end }}
