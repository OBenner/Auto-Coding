{{- /*
Service manifests for AutoClaude components
*/ -}}
{{- if .Values.postgresql.enabled }}
---
# PostgreSQL Database Service (Internal only - ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autoclaude.fullname" . }}-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "autoclaude.labels" . | nindent 4 }}
    component: database
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
  - port: {{ .Values.postgresql.service.port }}
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    {{- include "autoclaude.selectorLabels" . | nindent 4 }}
    component: database
{{- end }}

{{- if .Values.redis.enabled }}
---
# Redis Cache Service (Internal only - ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autoclaude.fullname" . }}-redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "autoclaude.labels" . | nindent 4 }}
    component: cache
spec:
  type: {{ .Values.redis.service.type }}
  ports:
  - port: {{ .Values.redis.service.port }}
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    {{- include "autoclaude.selectorLabels" . | nindent 4 }}
    component: cache
{{- end }}

{{- if .Values.backend.enabled }}
---
# AutoClaude Backend Service (External access)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autoclaude.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "autoclaude.labels" . | nindent 4 }}
    component: backend
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    {{- include "autoclaude.selectorLabels" . | nindent 4 }}
    component: backend
  {{- if eq .Values.backend.service.type "LoadBalancer" }}
  # Session affinity for WebSocket support
  sessionAffinity: {{ .Values.backend.service.sessionAffinity }}
  {{- with .Values.backend.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
