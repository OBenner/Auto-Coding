{{- /*
Ingress manifest for AutoClaude backend
*/ -}}
{{- if and .Values.backend.enabled .Values.backend.ingress.enabled -}}
---
# AutoClaude Backend Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "autoclaude.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "autoclaude.labels" . | nindent 4 }}
    component: backend
  {{- with .Values.backend.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.backend.ingress.className }}
  ingressClassName: {{ .Values.backend.ingress.className }}
  {{- end }}
  rules:
  {{- range .Values.backend.ingress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ include "autoclaude.fullname" $ }}
            port:
              number: {{ $.Values.backend.service.port }}
      {{- end }}
  {{- end }}
  {{- if .Values.backend.ingress.tls }}
  tls:
    {{- toYaml .Values.backend.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
