---
# Ingress for Auto Claude Web Backend
#
# This provides HTTPS access to the backend API with TLS termination.
# Requires an Ingress Controller (nginx, traefik, etc.) to be installed in the cluster.
#
# For cert-manager with Let's Encrypt:
# 1. Install cert-manager: https://cert-manager.io/docs/installation/
# 2. Create ClusterIssuer for Let's Encrypt (see comments below)
# 3. Uncomment the cert-manager annotations
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autoclaude-ingress
  namespace: default
  labels:
    app: autoclaude
  annotations:
    # Ingress class (use appropriate controller)
    kubernetes.io/ingress.class: "nginx"

    # SSL/TLS configuration
    # Uncomment for cert-manager with Let's Encrypt:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # cert-manager.io/acme-challenge-type: "http01"

    # NGINX specific annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # CORS configuration (if not handled by backend)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "https://autoclaude.app"
    # nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    # nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "web-backend"

    # Request size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

    # Rate limiting (adjust as needed)
    nginx.ingress.kubernetes.io/limit-rps: "100"

spec:
  # TLS configuration
  tls:
  - hosts:
    - api.autoclaude.app
    secretName: autoclaude-tls-cert  # cert-manager will create this

  rules:
  # API Backend
  - host: api.autoclaude.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-backend
            port:
              number: 80

---
# ClusterIssuer for Let's Encrypt (optional - requires cert-manager)
#
# Uncomment to use cert-manager for automatic TLS certificate management:
#
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: letsencrypt-prod
# spec:
#   acme:
#     # ACME server URL for Let's Encrypt production
#     server: https://acme-v02.api.letsencrypt.org/directory
#
#     # Email for certificate expiration notifications
#     email: admin@autoclaude.app
#
#     # Secret to store ACME account private key
#     privateKeySecretRef:
#       name: letsencrypt-prod-account-key
#
#     # HTTP-01 challenge solver
#     solvers:
#     - http01:
#         ingress:
#           class: nginx

---
