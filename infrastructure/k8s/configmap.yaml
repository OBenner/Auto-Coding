---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoclaude-config
  namespace: default
  labels:
    app: autoclaude
data:
  # Server configuration
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  # CORS configuration
  CORS_ORIGINS: "https://autoclaude.app,https://www.autoclaude.app"

  # JWT configuration
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

  # Database configuration
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "autoclaude"
  DATABASE_URL: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/autoclaude"

  # Redis configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # OAuth configuration (redirect URI - public facing)
  OAUTH_REDIRECT_URI: "https://api.autoclaude.app/api/git/callback"

  # WebSocket configuration
  WS_HEARTBEAT_INTERVAL: "30"
