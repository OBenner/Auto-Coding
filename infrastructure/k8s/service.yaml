---
# PostgreSQL Service (Internal only - ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
  labels:
    app: autoclaude
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: autoclaude
    component: database

---
# Redis Service (Internal only - ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels:
    app: autoclaude
    component: cache
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: autoclaude
    component: cache

---
# Web Backend Service (External access)
apiVersion: v1
kind: Service
metadata:
  name: web-backend
  namespace: default
  labels:
    app: autoclaude
    component: backend
  annotations:
    # Cloud-specific annotations (uncomment as needed)
    # AWS: service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # GCP: cloud.google.com/load-balancer-type: "Internal"
    # Azure: service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer  # Change to NodePort if LoadBalancer is not available
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: autoclaude
    component: backend
  # Session affinity for WebSocket support
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
