---
# Kubernetes Secrets for Auto Claude Cloud
#
# IMPORTANT: This is an example file with placeholder values.
# DO NOT commit actual secrets to version control!
#
# To use:
# 1. Copy this file to secrets.yaml
# 2. Replace all placeholder values with actual secrets
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore
#
apiVersion: v1
kind: Secret
metadata:
  name: autoclaude-secrets
  namespace: default
  labels:
    app: autoclaude
type: Opaque
stringData:
  # Authentication secret key for JWT tokens
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  SECRET_KEY: "change-me-generate-secure-random-string"

  # PostgreSQL password
  POSTGRES_PASSWORD: "change-me-secure-postgres-password"

  # Redis password (optional, leave empty if not using Redis auth)
  REDIS_PASSWORD: ""

  # GitHub OAuth credentials
  # Register app at: https://github.com/settings/developers
  GITHUB_CLIENT_ID: "your-github-client-id"
  GITHUB_CLIENT_SECRET: "your-github-client-secret"

  # GitLab OAuth credentials
  # Register app at: https://gitlab.com/-/profile/applications
  GITLAB_CLIENT_ID: "your-gitlab-client-id"
  GITLAB_CLIENT_SECRET: "your-gitlab-client-secret"
