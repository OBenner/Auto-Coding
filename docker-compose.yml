version: '3.8'

services:
  # PostgreSQL database for user data and repositories
  postgres:
    image: postgres:16-alpine
    container_name: autoclaude-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoclaude
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autoclaude-network
    restart: unless-stopped

  # Redis for usage tracking and caching
  redis:
    image: redis:7-alpine
    container_name: autoclaude-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autoclaude-network
    restart: unless-stopped

  # Auto Code backend CLI service
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: autoclaude-backend
    environment:
      # Claude API configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5-20250929}

      # Graphiti memory configuration
      GRAPHITI_ENABLED: ${GRAPHITI_ENABLED:-true}
      GRAPHITI_LLM_PROVIDER: ${GRAPHITI_LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # GitHub integration
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # Linear integration
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}

      # Project configuration
      PROJECT_DIR: /app
      AUTO_CLAUDE_CI: ${AUTO_CLAUDE_CI:-false}
      AUTO_CLAUDE_JSON_OUTPUT: ${AUTO_CLAUDE_JSON_OUTPUT:-false}
    volumes:
      - backend_data:/app/.auto-claude
      - backend_worktrees:/app/.worktrees
      # Mount local code for development (comment out in production)
      - ./apps/backend:/app:ro
    networks:
      - autoclaude-network
    restart: unless-stopped

  # Auto Code web backend API
  web-backend:
    build:
      context: ./apps/web-backend
      dockerfile: Dockerfile
    container_name: autoclaude-web-backend
    environment:
      # Server configuration
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # CORS configuration
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://autoclaude.app}

      # Authentication
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      # Database configuration (connect to postgres service)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/autoclaude

      # Redis configuration (connect to redis service)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # OAuth configuration
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/api/git/callback}

      # WebSocket configuration
      WS_HEARTBEAT_INTERVAL: 30

      # Backend directory for agent execution
      AUTO_CLAUDE_BACKEND_DIR: ${AUTO_CLAUDE_BACKEND_DIR:-/app/backend}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Mount auto-claude backend directory if available locally
      # Comment out in production deployment
      - ${AUTO_CLAUDE_BACKEND_DIR:-./apps/backend}:/app/backend:ro
    networks:
      - autoclaude-network
    restart: unless-stopped

  # Auto Code web frontend (Vite + React + nginx)
  web-frontend:
    build:
      context: ./apps/web-frontend
      dockerfile: Dockerfile
    container_name: autoclaude-web-frontend
    environment:
      # API backend URL
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      web-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - autoclaude-network
    restart: unless-stopped

networks:
  autoclaude-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_data:
    driver: local
  backend_worktrees:
    driver: local
