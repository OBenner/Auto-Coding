# Auto Claude Web Backend Server Configuration
# Copy this file to /etc/auto-claude/auto-claude-server.conf
# Adjust values for your deployment environment

# ============================================================
# Server Configuration
# ============================================================

# Host to bind to (0.0.0.0 for all interfaces, 127.0.0.1 for localhost only)
HOST=0.0.0.0

# Port to listen on
PORT=8000

# Number of uvicorn worker processes (recommended: 2 * CPU cores + 1)
WORKERS=4

# ============================================================
# Security - CHANGE IN PRODUCTION!
# ============================================================

# Set to false in production
DEBUG=false

# Secret key for JWT signing - generate with: openssl rand -hex 32
SECRET_KEY=CHANGE_ME_USE_OPENSSL_RAND_HEX_32

# CORS allowed origins (comma-separated)
# Example: https://app.example.com,https://admin.example.com
CORS_ORIGINS=http://localhost:3000

# ============================================================
# Authentication
# ============================================================

# JWT token expiry in minutes
ACCESS_TOKEN_EXPIRE_MINUTES=60

# Claude OAuth token for agent sessions
# Generate with: claude setup-token --print
CLAUDE_CODE_OAUTH_TOKEN=

# ============================================================
# Logging
# ============================================================

# Log level: debug, info, warning, error, critical
LOG_LEVEL=info

# Log file path (leave blank to log to stdout/journal only)
LOG_FILE=/var/log/auto-claude/server.log

# ============================================================
# WebSocket
# ============================================================

# Heartbeat interval in seconds
WS_HEARTBEAT_INTERVAL=30

# ============================================================
# Agent Configuration
# ============================================================

# Claude model to use for agent sessions
CLAUDE_MODEL=claude-sonnet-4-5-20250929

# Enable Graphiti memory system
GRAPHITI_ENABLED=false

# Optional: OpenAI API key (required if GRAPHITI_ENABLED=true with openai provider)
# OPENAI_API_KEY=

# ============================================================
# Paths
# ============================================================

# Base directory for auto-claude data (specs, worktrees, etc.)
AUTO_CLAUDE_DATA_DIR=/opt/auto-claude/.auto-claude
