apiVersion: v1
kind: Secret
metadata:
  name: auto-claude-secrets
  namespace: {{ include "auto-code.namespace" . }}
  labels:
    {{- include "auto-code.labels" . | nindent 4 }}
    app: auto-claude
    component: secrets
type: Opaque
data:
  # PostgreSQL credentials (base64 encoded)
  postgres-user: {{ .Values.secrets.postgresUser | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}

  # Database URL (base64 encoded)
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}

  # Redis password (optional, base64 encoded)
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- else }}
  redis-password: ""
  {{- end }}

  # Secret key for JWT tokens (base64 encoded)
  secret-key: {{ .Values.secrets.secretKey | b64enc | quote }}

  # Claude API keys (base64 encoded)
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- else }}
  anthropic-api-key: ""
  {{- end }}
  {{- if .Values.secrets.claudeCodeOauthToken }}
  claude-code-oauth-token: {{ .Values.secrets.claudeCodeOauthToken | b64enc | quote }}
  {{- else }}
  claude-code-oauth-token: ""
  {{- end }}

  # OpenAI API key for Graphiti memory (base64 encoded)
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- else }}
  openai-api-key: ""
  {{- end }}

  # GitHub OAuth credentials (base64 encoded, optional)
  {{- if .Values.secrets.githubClientId }}
  github-client-id: {{ .Values.secrets.githubClientId | b64enc | quote }}
  {{- else }}
  github-client-id: ""
  {{- end }}
  {{- if .Values.secrets.githubClientSecret }}
  github-client-secret: {{ .Values.secrets.githubClientSecret | b64enc | quote }}
  {{- else }}
  github-client-secret: ""
  {{- end }}

  # GitHub personal access token (base64 encoded, optional)
  {{- if .Values.secrets.githubToken }}
  github-token: {{ .Values.secrets.githubToken | b64enc | quote }}
  {{- else }}
  github-token: ""
  {{- end }}

  # GitLab OAuth credentials (base64 encoded, optional)
  {{- if .Values.secrets.gitlabClientId }}
  gitlab-client-id: {{ .Values.secrets.gitlabClientId | b64enc | quote }}
  {{- else }}
  gitlab-client-id: ""
  {{- end }}
  {{- if .Values.secrets.gitlabClientSecret }}
  gitlab-client-secret: {{ .Values.secrets.gitlabClientSecret | b64enc | quote }}
  {{- else }}
  gitlab-client-secret: ""
  {{- end }}

  # Linear API key (base64 encoded, optional)
  {{- if .Values.secrets.linearApiKey }}
  linear-api-key: {{ .Values.secrets.linearApiKey | b64enc | quote }}
  {{- else }}
  linear-api-key: ""
  {{- end }}
