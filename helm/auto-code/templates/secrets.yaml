apiVersion: v1
kind: Secret
metadata:
  name: auto-claude-secrets
  namespace: {{ include "auto-code.namespace" . }}
  labels:
    {{- include "auto-code.labels" . | nindent 4 }}
    app: auto-claude
    component: secrets
type: Opaque
stringData:
  # PostgreSQL credentials
  {{- if .Values.secrets.postgresUser }}
  postgres-user: {{ .Values.secrets.postgresUser | quote }}
  {{- end }}
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}

  # Database URL
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}

  # Redis password (optional)
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}

  # Secret key for JWT tokens
  {{- if .Values.secrets.secretKey }}
  secret-key: {{ .Values.secrets.secretKey | quote }}
  {{- end }}

  # Claude API keys
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.claudeCodeOauthToken }}
  claude-code-oauth-token: {{ .Values.secrets.claudeCodeOauthToken | quote }}
  {{- end }}

  # OpenAI API key for Graphiti memory
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}

  # GitHub OAuth credentials (optional)
  {{- if .Values.secrets.githubClientId }}
  github-client-id: {{ .Values.secrets.githubClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.githubClientSecret }}
  github-client-secret: {{ .Values.secrets.githubClientSecret | quote }}
  {{- end }}

  # GitHub personal access token (optional)
  {{- if .Values.secrets.githubToken }}
  github-token: {{ .Values.secrets.githubToken | quote }}
  {{- end }}

  # GitLab OAuth credentials (optional)
  {{- if .Values.secrets.gitlabClientId }}
  gitlab-client-id: {{ .Values.secrets.gitlabClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.gitlabClientSecret }}
  gitlab-client-secret: {{ .Values.secrets.gitlabClientSecret | quote }}
  {{- end }}

  # Linear API key (optional)
  {{- if .Values.secrets.linearApiKey }}
  linear-api-key: {{ .Values.secrets.linearApiKey | quote }}
  {{- end }}
