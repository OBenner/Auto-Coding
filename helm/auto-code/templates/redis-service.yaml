{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "auto-code.namespace" . }}
  labels:
    {{- include "auto-code.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "auto-code.redis.selectorLabels" . | nindent 4 }}
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
{{- end }}
