{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "auto-code.namespace" . }}
  labels:
    {{- include "auto-code.postgres.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      {{- include "auto-code.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auto-code.postgres.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
        imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: auto-claude-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auto-claude-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: auto-claude-config
              key: postgres-db
        - name: POSTGRES_INITDB_ARGS
          value: "-E UTF8"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          {{- toYaml .Values.postgres.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.postgres.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
      restartPolicy: Always
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      labels:
        {{- include "auto-code.postgres.labels" . | nindent 8 }}
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.postgres.persistence.size }}
      {{- if .Values.postgres.persistence.storageClass }}
      storageClassName: {{ .Values.postgres.persistence.storageClass }}
      {{- end }}
{{- end }}
