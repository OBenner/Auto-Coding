apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: auto-claude
  labels:
    app: auto-claude
    component: backend
spec:
  type: ClusterIP
  clusterIP: None  # Headless service - no load balancing needed
  selector:
    app: auto-claude
    component: backend
  # No ports defined - backend is CLI-based and doesn't expose network services
