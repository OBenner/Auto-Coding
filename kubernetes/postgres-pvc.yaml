apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: auto-claude
  labels:
    app: auto-claude
    component: postgres
    tier: database
    purpose: backup
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data-pvc
  namespace: auto-claude
  labels:
    app: auto-claude
    component: backend
    tier: application
    purpose: data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-worktrees-pvc
  namespace: auto-claude
  labels:
    app: auto-claude
    component: backend
    tier: application
    purpose: worktrees
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
