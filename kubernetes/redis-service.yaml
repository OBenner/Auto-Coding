apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: auto-claude
  labels:
    app: auto-claude
    component: redis
    tier: cache
spec:
  type: ClusterIP
  selector:
    app: auto-claude
    component: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
