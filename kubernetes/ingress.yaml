apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auto-claude-ingress
  namespace: auto-claude
  labels:
    app: auto-claude
    component: ingress
  annotations:
    # Nginx ingress controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # WebSocket support for web-backend
    nginx.ingress.kubernetes.io/websocket-services: web-backend
    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # Body size limit for file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Timeouts for long-running requests
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # SSL/TLS configuration (uncomment and configure for production)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: nginx
  # TLS configuration (uncomment and configure for production)
  # tls:
  # - hosts:
  #   - autoclaude.example.com
  #   - api.autoclaude.example.com
  #   secretName: auto-claude-tls
  rules:
  # Frontend application
  - host: autoclaude.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-frontend
            port:
              number: 80
  # Backend API
  - host: api.autoclaude.example.com  # Replace with your API domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-backend
            port:
              number: 8000
  # Alternative: Single domain with path-based routing
  # - host: autoclaude.example.com
  #   http:
  #     paths:
  #     - path: /api
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: web-backend
  #           port:
  #             number: 8000
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: web-frontend
  #           port:
  #             number: 80
