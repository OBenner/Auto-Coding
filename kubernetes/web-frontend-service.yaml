apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: auto-claude
  labels:
    app: auto-claude
    component: web-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For AWS
spec:
  type: LoadBalancer
  selector:
    app: auto-claude
    component: web-frontend
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
